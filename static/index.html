<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Stats</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
    <link rel="icon" href="/static/favicon.jpg">
</head>

<body>

    <div class="header">
        <h1>Router Stats</h1>
        <div class="header-actions">
            <button class="refresh-btn" onclick="exportData()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Export
            </button>
            <button class="refresh-btn" onclick="fetchData(true)">
                <svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                Refresh
            </button>
        </div>
    </div>

    <div class="container">

        <!-- Traffic Summary -->
        <div class="traffic-grid">
            <div class="traffic-card">
                <div class="traffic-label">↓ Total Download</div>
                <div class="traffic-value c-green" id="total-down" translate="no">—</div>
            </div>
            <div class="traffic-card">
                <div class="traffic-label">↑ Total Upload</div>
                <div class="traffic-value c-blue" id="total-up" translate="no">—</div>
            </div>
            <div class="traffic-card">
                <div class="traffic-label">⇅ Data Transferred</div>
                <div class="traffic-value c-purple" id="total-traffic" translate="no">—</div>
            </div>
        </div>

        <!-- Main grid -->
        <div class="main-grid">
            <!-- System Status -->
            <div class="metric-stack">
                <div class="metric-tile">
                    <div class="metric-label">Uptime</div>
                    <div class="metric-value c-cyan" id="m-uptime" translate="no">—</div>
                </div>
                <div class="metric-tile">
                    <div class="metric-label">CPU Usage</div>
                    <div class="metric-value c-purple" id="m-cpu" translate="no">—</div>
                </div>
                <div class="metric-tile">
                    <div class="metric-label">Memory Usage</div>
                    <div class="metric-value c-pink" id="m-mem" translate="no">—</div>
                </div>
                <div class="metric-tile">
                    <div class="metric-label">Total Clients</div>
                    <div class="metric-value c-green" id="m-clients" translate="no">—</div>
                </div>
            </div>

            <!-- Right: tables -->
            <div class="right-panel">
                <div class="tables-row">
                    <!-- Mesh Devices -->
                    <div class="card">
                        <div class="card-title">Mesh Devices</div>
                        <div class="tbl-wrap">
                            <table class="mesh-table">
                                <thead id="mesh-thead">
                                    <tr>
                                        <th class="sortable" data-key="device_name" data-type="string">Name</th>
                                        <th class="sortable" data-key="device_type" data-type="string">Type</th>
                                        <th class="sortable" data-key="ip" data-type="ip">IP</th>
                                        <th class="sortable center" data-key="connected_clients" data-type="number">
                                            Clients</th>
                                        <th class="sortable" data-key="location" data-type="string">Location</th>
                                        <th class="sortable center" data-key="signal_strength" data-type="number">Signal
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="mesh-tbody" translate="no">
                                    <tr>
                                        <td colspan="6" class="skeleton">Loading…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Connected Devices -->
                    <div class="card">
                        <div class="card-title">Connected Devices</div>
                        <div class="tbl-wrap">
                            <table class="devices-table">
                                <thead id="devices-thead">
                                    <tr>
                                        <th class="sortable" data-key="device_name" data-type="string">Device</th>
                                        <th class="sortable" data-key="device_type" data-type="string">Type</th>
                                        <th class="sortable" data-key="ip" data-type="ip">IP</th>
                                        <th class="sortable" data-key="data_transfering_sort" data-type="number">Traffic
                                        </th>
                                        <th class="sortable" data-key="data_transferred" data-type="number">Total</th>
                                    </tr>
                                </thead>
                                <tbody id="devices-tbody" translate="no">
                                    <tr>
                                        <td colspan="5" class="skeleton">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="error-banner" id="error-banner"></div>

        <div class="footer">
            <span class="live-dot"></span>
            <span id="last-updated">Fetching data…</span>
        </div>
    </div>

</body>

</html>
